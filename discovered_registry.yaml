  inputs:
    input_type:
      type: string
      description: set whether the input is the FASTA file of metagenomic reads or  the
        SAM file of the mapping of the reads against the MetaPhlAn db.
      required: true
      source: help_parsed
      flag: --input_type
      takes_value: true
    force:
      type: boolean
      description: Force profiling of the input file by removing the mapout file
      required: false
      source: help_parsed
      flag: --force
      takes_value: false
    mapout:

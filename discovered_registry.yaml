      required: false
      source: help_parsed
      flag: --min_mapq_val
      takes_value: true
    no_map:
      type: boolean
      description: Avoid storing the --mapout map file
      required: false
      source: help_parsed
      flag: --no_map
      takes_value: false
    tmp_dir:
      type: string
      description: The folder used to store temporary files
      required: false
      source: help_parsed
      flag: --tmp_dir
      takes_value: false
    bt2_ps:
      type: path
      description: Presets options for BowTie2 (applied only when a FASTA file is

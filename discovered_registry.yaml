- name: metaphlan
  type: cli
  command: metaphlan {{input_file}} --input_type {{input_type}} --force {{force}}
    --db_dir {{db_dir}} --index {{index}} --mapout {{mapout}} --min_mapq_val {{min_mapq_val}}
    --no_map {{no_map}} --tmp_dir {{tmp_dir}} --bt2_ps {{bt2_ps}} --bowtie2_exe {{bowtie2_exe}}
    --bowtie2_build {{bowtie2_build}} --tax_lev {{tax_lev}} --min_alignment_len {{min_alignment_len}}
    --ignore_eukaryotes {{ignore_eukaryotes}} --ignore_bacteria {{ignore_bacteria}}
    --ignore_archaea {{ignore_archaea}} --ignore_ksgbs {{ignore_ksgbs}} --ignore_usgbs
    {{ignore_usgbs}} --stat_q {{stat_q}} --perc_nonzero {{perc_nonzero}}
  arg_style: positional
  callable_via: ''
  readme_examples: []

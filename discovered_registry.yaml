    --ignore_eukaryotes {{ignore_eukaryotes}} --ignore_bacteria {{ignore_bacteria}}
    --ignore_archaea {{ignore_archaea}} --ignore_ksgbs {{ignore_ksgbs}} --ignore_usgbs

tools:
- name: cooltools
  type: cli
  command: cooltools {{subcommand}}
  arg_style: subcommand
  callable_via: ''
  readme_examples: []
  readme_usage: ''
  description: '[Auto-discovered] The tools for your .cool''s (⭐168, Jupyter Notebook)
    (license: LICENSE)'
  output_control:
    intercept_large_output: true
    max_preview_lines: 50
  inputs: {}
  resources: {}
  outputs:
    stdout:
      type: text
      description: Tool result printed to stdout.
      source: inferred
  execution: null
  subcommands:
  - coverage
  - dots
  - eigs-cis
  - eigs-trans
  - expected-cis
  - expected-trans
  - genome
  - insulation
  - pileup
  - random-sample
  - rearrange
  - saddle
  - virtual4c
  subcommand_details:
    coverage:
      params:
      - name: --output
        type: path
        description: Specify output file name to store the coverage in a  tsv format.
        required: false
        takes_value: true
        aliases:
        - -o
      - name: --ignore-diags
        type: integer
        description: The number of diagonals to ignore. By default,  equals the number
          of diagonals ignored during IC  balancing.
        required: false
        takes_value: true
      - name: --store
        type: boolean
        description: Append columns with coverage (cov_cis_raw,  cov_tot_raw), or
          (cov_cis_clr_weight_name,  cov_tot_clr_weight_name) if calculating balanced  coverage,
          to the cooler bin table. If  clr_weight_name=None, also stores total cis
          counts  in the cooler info
        required: false
        takes_value: false
      - name: --chunksize
        type: integer
        description: Split the contact matrix pixel records into equally  sized chunks
          to save memory and/or parallelize.  Default is 10^7
        required: false
        takes_value: true
      - name: --bigwig
        type: boolean
        description: Also save output as bigWig files for cis and total  coverage
          with the names <output>.<cis/tot>.bw
        required: false
        takes_value: false
      - name: --clr_weight_name
        type: string
        description: Name of the weight column. Specify to calculate  coverage of
          balanced cooler.
        required: false
        takes_value: true
      - name: --nproc
        type: integer
        description: Number of processes to split the work between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      usage: cooltools coverage [OPTIONS] COOL_PATH
      outputs:
        output:
          type: file
          description: Specify output file name to store the coverage in a  tsv format.
          input: output
          source: help_parsed
    dots:
      params:
      - name: --view
        type: path
        description: Path to a BED file with the definition of  viewframe (regions)
          used in the calculation  of EXPECTED_PATH. Dot-calling will be  performed
          for these regions independently  e.g. chromosome arms. Note that '--regions'  is
          the deprecated name of the option. Use '--  view' instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --clr-weight-name
        type: string
        description: Use cooler balancing weight with this name.
        required: false
        takes_value: true
      - name: --nproc
        type: integer
        description: Number of processes to split the work  between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: --max-loci-separation
        type: integer
        description: Limit loci separation for dot-calling, i.e.,  do not call dots
          for loci that are further  than max_loci_separation basepair apart.  2-20MB
          is reasonable and would capture most  of CTCF-dots.
        required: false
        takes_value: true
      - name: --max-nans-tolerated
        type: integer
        description: Maximum number of NaNs tolerated in a  footprint of every used
          filter. Must be  controlled with caution, as large max-nans-  tolerated,
          might lead to pixels scored in the  padding area of the tiles to "penetrate"
          to  the list of scored pixels for the statistical  testing. [max-nans-tolerated
          <= 2*w ]
        required: false
        takes_value: true
      - name: --tile-size
        type: integer
        description: Tile size for the Hi-C heatmap tiling.  Typically on order of
          several mega-bases, and  <= max_loci_separation.
        required: false
        takes_value: true
      - name: --num-lambda-bins
        type: integer
        description: Number of log-spaced bins to divide your  adjusted expected between.
          Same as  HiCCUPS_W1_MAX_INDX (40) in the original  HiCCUPS.
        required: false
        takes_value: true
      - name: --fdr
        type: float
        description: False discovery rate (FDR) to control in the  multiple hypothesis
          testing BH-FDR procedure.
        required: false
        takes_value: true
      - name: --clustering-radius
        type: integer
        description: Radius for clustering dots that have been  called too close to
          each other.Typically on  order of 40 kilo-bases, and >= binsize.
        required: false
        takes_value: true
      - name: --verbose
        type: boolean
        description: Enable verbose output
        required: false
        takes_value: false
        aliases:
        - -v
      - name: --output
        type: string
        description: Specify output file name to store called dots  in a BEDPE-like
          format
        required: true
        takes_value: true
        choices:
        - required
        aliases:
        - -o
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      - name: expected_path
        type: path
        description: Positional argument EXPECTED_PATH
        required: true
        positional: true
        position: 1
      usage: cooltools dots [OPTIONS] COOL_PATH EXPECTED_PATH
      outputs:
        output:
          type: file
          description: Specify output file name to store called dots  in a BEDPE-like
            format
          input: output
          source: help_parsed
    eigs-cis:
      params:
      - name: --phasing-track
        type: path
        description: Phasing track for orienting and ranking  eigenvectors,provided
          as  /path/to/track::track_value_column_name.
        required: false
        takes_value: true
      - name: --view
        type: path
        description: Path to a BED file which defines which regions  of the chromosomes
          to use (only implemented for  cis contacts). Note that '--regions' is the  deprecated
          name of the option. Use '--view'  instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --n-eigs
        type: integer
        description: Number of eigenvectors to compute.
        required: false
        takes_value: true
      - name: --clr-weight-name
        type: string
        description: Use balancing weight with this name. Using raw  unbalanced data
          is not currently supported for  eigenvectors.
        required: false
        takes_value: true
      - name: --ignore-diags
        type: integer
        description: The number of diagonals to ignore. By default,  equals the number
          of diagonals ignored during IC  balancing.
        required: false
        takes_value: true
      - name: --verbose
        type: boolean
        description: Enable verbose output
        required: false
        takes_value: false
        aliases:
        - -v
      - name: --out-prefix
        type: string
        description: Save compartment track as a BED-like file.  Eigenvectors and
          corresponding eigenvalues are  stored in out_prefix.contact_type.vecs.tsv
          and  out_prefix.contact_type.lam.txt
        required: true
        takes_value: true
        choices:
        - required
        aliases:
        - -o
      - name: --bigwig
        type: boolean
        description: Also save compartment track (E1) as a bigWig  file with the name
          out_prefix.contact_type.bw
        required: false
        takes_value: false
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      usage: cooltools eigs-cis [OPTIONS] COOL_PATH
      outputs:
        out_prefix:
          type: file
          description: Save compartment track as a BED-like file.  Eigenvectors and
            corresponding eigenvalues are  stored in out_prefix.contact_type.vecs.tsv
            and  out_prefix.contact_type.lam.txt
          input: out_prefix
          source: help_parsed
    eigs-trans:
      params:
      - name: --phasing-track
        type: path
        description: Phasing track for orienting and ranking  eigenvectors,provided
          as  /path/to/track::track_value_column_name.
        required: false
        takes_value: true
      - name: --view
        type: path
        description: Path to a BED file which defines which regions  of the chromosomes
          to use (only implemented for  cis contacts).  Note that '--regions' is the  deprecated
          name of the option. Use '--view'  instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --n-eigs
        type: integer
        description: Number of eigenvectors to compute.
        required: false
        takes_value: true
      - name: --clr-weight-name
        type: string
        description: Use balancing weight with this name. Using raw  unbalanced data
          is not supported for saddles.
        required: false
        takes_value: true
      - name: --verbose
        type: boolean
        description: Enable verbose output
        required: false
        takes_value: false
        aliases:
        - -v
      - name: --out-prefix
        type: string
        description: Save compartment track as a BED-like file.  Eigenvectors and
          corresponding eigenvalues are  stored in out_prefix.contact_type.vecs.tsv
          and  out_prefix.contact_type.lam.txt
        required: true
        takes_value: true
        choices:
        - required
        aliases:
        - -o
      - name: --bigwig
        type: boolean
        description: Also save compartment track (E1) as a bigWig  file with the name
          out_prefix.contact_type.bw
        required: false
        takes_value: false
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      usage: cooltools eigs-trans [OPTIONS] COOL_PATH
      outputs:
        out_prefix:
          type: file
          description: Save compartment track as a BED-like file.  Eigenvectors and
            corresponding eigenvalues are  stored in out_prefix.contact_type.vecs.tsv
            and  out_prefix.contact_type.lam.txt
          input: out_prefix
          source: help_parsed
    expected-cis:
      params:
      - name: --nproc
        type: integer
        description: Number of processes to split the work  between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: --chunksize
        type: integer
        description: Control the number of pixels handled by each worker  process
          at a time.
        required: false
        takes_value: true
        aliases:
        - -c
      - name: --output
        type: path
        description: Specify output file name to store the expected in a  tsv format.
        required: false
        takes_value: true
        aliases:
        - -o
      - name: --view
        type: path
        description: Path to a 3 or 4-column BED file with genomic  regions to calculated
          cis-expected on. When region  names are not provided (no 4th column), UCSC-style  region
          names are generated. Cis-expected is  calculated for all chromosomes, when
          this is not  specified. Note that '--regions' is the deprecated  name of
          the option. Use '--view' instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --smooth
        type: boolean
        description: If set, cis-expected is smoothed and result stored  in an additional
          column e.g. balanced.avg.smoothed
        required: false
        takes_value: false
      - name: --aggregate-smoothed
        type: boolean
        description: If set, cis-expected is averaged over all regions  and then smoothed.
          Result is stored in an  additional column, e.g. balanced.avg.smoothed.agg.  Ignored
          without smoothing
        required: false
        takes_value: false
      - name: --smooth-sigma
        type: float
        description: Control smoothing with the standard deviation of  the smoothing
          Gaussian kernel, ignored without  smoothing.
        required: false
        takes_value: true
      - name: --clr-weight-name
        type: string
        description: Use balancing weight with this name stored in  cooler.Provide
          empty argument to calculate cis-  expected on raw data
        required: false
        takes_value: true
      - name: --ignore-diags
        type: integer
        description: Number of diagonals to neglect for cis contact type
        required: false
        takes_value: true
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      usage: cooltools expected-cis [OPTIONS] COOL_PATH
      outputs:
        output:
          type: file
          description: Specify output file name to store the expected in a  tsv format.
          input: output
          source: help_parsed
    expected-trans:
      params:
      - name: --nproc
        type: integer
        description: Number of processes to split the work  between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: --chunksize
        type: integer
        description: Control the number of pixels handled by each worker  process
          at a time.
        required: false
        takes_value: true
        aliases:
        - -c
      - name: --output
        type: path
        description: Specify output file name to store the expected in a  tsv format.
        required: false
        takes_value: true
        aliases:
        - -o
      - name: --view
        type: path
        description: Path to a 3 or 4-column BED file with genomic  regions. Trans-expected
          is calculated on all  pairwise combinations of these regions. When region  names
          are not provided (no 4th column), UCSC-style  region names are generated.
          Trans-expected is  calculated  for all inter-chromosomal pairs, when  view
          is not specified. Note that '--regions' is the  deprecated name of the option.
          Use '--view'  instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --clr-weight-name
        type: string
        description: Use balancing weight with this name stored in  cooler.Provide
          empty argument to calculate cis-  expected on raw data
        required: false
        takes_value: true
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      usage: cooltools expected-trans [OPTIONS] COOL_PATH
      outputs:
        output:
          type: file
          description: Specify output file name to store the expected in a  tsv format.
          input: output
          source: help_parsed
    genome:
      params: []
      usage: cooltools genome [OPTIONS] COMMAND [ARGS]...
      outputs:
        stdout:
          type: text
          description: Tool result printed to stdout.
          source: inferred
    insulation:
      params:
      - name: --nproc
        type: integer
        description: Number of processes to split the work  between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: --output
        type: path
        description: Specify output file name to store the  insulation in a tsv format.
        required: false
        takes_value: true
        aliases:
        - -o
      - name: --view
        type: path
        description: Path to a BED file containing genomic regions  for which insulation
          scores will be  calculated. Region names can be provided in a  4th column
          and should match regions and their  names in expected. Note that '--regions'
          is  the deprecated name of the option. Use '--  view' instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --ignore-diags
        type: integer
        description: The number of diagonals to ignore. By  default, equals the number
          of diagonals  ignored during IC balancing.
        required: false
        takes_value: true
      - name: --clr-weight-name
        type: string
        description: Use balancing weight with this name. Provide  empty argument
          to calculate insulation on raw  data (no masking bad pixels).
        required: false
        takes_value: true
      - name: --min-frac-valid-pixels
        type: float
        description: The minimal fraction of valid pixels in a  sliding diamond. Used
          to mask bins during  boundary detection.
        required: false
        takes_value: true
      - name: --min-dist-bad-bin
        type: integer
        description: The minimal allowed distance to a bad bin.  Use to mask bins
          after insulation calculation  and during boundary detection.
        required: false
        takes_value: true
      - name: --threshold
        type: float
        description: Rule used to threshold the histogram of  boundary strengths to
          exclude weakboundaries.  'Li' or 'Otsu' use corresponding methods from  skimage.thresholding.Providing
          a float value  will filter by a fixed threshold
        required: false
        takes_value: true
      - name: --window-pixels
        type: boolean
        description: If set then the window sizes are provided in  units of pixels.
        required: false
        takes_value: false
      - name: --append-raw-scores
        type: boolean
        description: Append columns with raw scores (sum_counts,  sum_balanced, n_pixels)
          to the output table.
        required: false
        takes_value: false
      - name: --chunksize
        type: integer
        description: CLI flag --chunksize
        required: false
        takes_value: true
      - name: --verbose
        type: boolean
        description: Report real-time progress.
        required: false
        takes_value: false
      - name: --bigwig
        type: boolean
        description: Also save insulation tracks as a bigWig files  for different
          window sizes with the names  output.<window-size>.bw
        required: false
        takes_value: false
      - name: in_path
        type: path
        description: Positional argument IN_PATH
        required: true
        positional: true
        position: 0
      - name: window
        type: string
        description: Positional argument WINDOW
        required: true
        positional: true
        position: 1
      usage: cooltools insulation [OPTIONS] IN_PATH WINDOW
      outputs:
        output:
          type: file
          description: Specify output file name to store the  insulation in a tsv
            format.
          input: output
          source: help_parsed
    pileup:
      params:
      - name: --view
        type: path
        description: Path to a BED file which defines which  regions of the chromosomes
          to use.  Required  if EXPECTED_PATH is provided Note that '--  regions'
          is the deprecated name of the  option. Use '--view' instead.
        required: false
        takes_value: true
        aliases:
        - --regions
      - name: --expected
        type: path
        description: Path to the expected table. If provided,  outputs OOE pileup.  if
          not provided,  outputs regular pileup.
        required: false
        takes_value: true
      - name: --flank
        type: integer
        description: Size of flanks.
        required: false
        takes_value: true
      - name: --features-format
        type: path
        description: Input features format.
        required: false
        takes_value: true
      - name: --clr-weight-name
        type: string
        description: Use balancing weight with this name.
        required: false
        takes_value: true
      - name: --out
        type: string
        description: Save output pileup as NPZ/HDF5 file.
        required: true
        takes_value: true
        choices:
        - required
        aliases:
        - -o
      - name: --out-format
        type: string
        description: Type of output.
        required: false
        takes_value: true
      - name: --store-snips
        type: boolean
        description: Flag indicating whether snips should be  stored.
        required: false
        takes_value: false
      - name: --nproc
        type: integer
        description: Number of processes to split the work  between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: --ignore-diags
        type: integer
        description: The number of diagonals to ignore. By  default, equals the number
          of diagonals  ignored during IC balancing.
        required: false
        takes_value: true
      - name: --aggregate
        type: string
        description: Function for calculating aggregate signal.
        required: false
        takes_value: true
      - name: --verbose
        type: boolean
        description: Enable verbose output
        required: false
        takes_value: false
        aliases:
        - -v
      - name: cool_path
        type: path
        description: Positional argument COOL_PATH
        required: true
        positional: true
        position: 0
      - name: features_path
        type: path
        description: Positional argument FEATURES_PATH
        required: true
        positional: true
        position: 1
      usage: cooltools pileup [OPTIONS] COOL_PATH FEATURES_PATH
      outputs:
        out:
          type: file
          description: Save output pileup as NPZ/HDF5 file.
          input: out
          source: help_parsed
        out_format:
          type: file
          description: Type of output.
          input: out_format
          source: help_parsed
    random-sample:
      params:
      - name: --count
        type: integer
        description: The target number of contacts in the sample. The  resulting sample
          size will not match it precisely.  Mutually exclusive with --frac and --cis-count
        required: false
        takes_value: true
        aliases:
        - -c
      - name: --cis-count
        type: integer
        description: The target number of cis contacts in the sample. The  resulting
          sample size will not match it precisely.  Mutually exclusive with --count
          and --frac
        required: false
        takes_value: true
      - name: --frac
        type: float
        description: The target sample size as a fraction of contacts in the  original
          dataset. Mutually exclusive with --count and
        required: false
        takes_value: true
        aliases:
        - -f
      - name: --exact
        type: boolean
        description: If specified, use exact sampling that guarantees the  size of
          the output sample. Otherwise, binomial sampling  will be used and the sample
          size will be distributed  around the target value.
        required: false
        takes_value: false
      - name: --nproc
        type: integer
        description: Number of processes to split the work between.
        required: false
        takes_value: true
        aliases:
        - -p
      - name: --chunksize
        type: integer
        description: The number of pixels loaded and processed per step of  computation.
        required: false
        takes_value: true
      - name: in_path
        type: path
        description: Positional argument IN_PATH
        required: true
        positional: true
        position: 0
      - name: out_path
        type: path
        description: Positional argument OUT_PATH
        required: true
        positional: true
        position: 1
      usage: cooltools random-sample [OPTIONS] IN_PATH OUT_PATH
      outputs:
        out_path:
          type: file
          description: Positional argument OUT_PATH
          input: out_path
          source: help_parsed
    rearrange:
      params:
      - name: --view
        type: path
        description: Path to a BED-like file which defines which regions  of the chromosomes
          to use and in what order. Using
        required: false
        takes_value: true
      - name: --new-chrom-col
        type: string
        description: CLI flag --new-chrom-col
        required: false
        takes_value: true
        aliases:
        - --orientation-col
      - name: --orientation-col
        type: path
        description: Columns name in the view with orientations of each  region (+
          or -). If not providedand there is no  column named 'strand' in the view
          file, assumes all  are forward oriented
        required: false
        takes_value: true
      - name: --assembly
        type: string
        description: The name of the assembly for the new cooler. If  None, uses the
          same as in the original cooler.
        required: false
        takes_value: true
      - name: --chunksize
        type: integer
        description: The number of pixels loaded and processed per step  of computation.
        required: false
        takes_value: true
      - name: --mode
        type: path
        description: '(w)rite or (a)ppend to the output file (default: w)'
        required: false
        takes_value: true
      - name: in_path
        type: path
        description: Positional argument IN_PATH
        required: true
        positional: true
        position: 0
      - name: out_path
        type: path
        description: Positional argument OUT_PATH
        required: true
        positional: true
        position: 1
      usage: cooltools rearrange [OPTIONS] IN_PATH OUT_PATH
      outputs:
        out_path:
          type: file
          description: Positional argument OUT_PATH
          input: out_path
          source: help_parsed
    saddle:
      params:
      - name: --contact-type
        type: string
        description: Type of the contacts to aggregate
        required: false
        takes_value: true
        aliases:
        - -t
      - name: --min-dist
        type: integer
        description: Minimal distance between bins to consider,  bp. If negative,
          removesthe first two  diagonals of the data. Ignored with
        required: false
        takes_value: true
      - name: --max-dist
        type: integer
        description: Maximal distance between bins to consider,  bp. Ignored, if negative.
          Ignored with
        required: false
        takes_value: true
      - name: --n-bins
        type: integer
        description: Number of bins for digitizing track values.
        required: false
        takes_value: true
        aliases:
        - -n
      - name: --vrange
        type: float
        description: Low and high values used for binning genome-  wide track values,
          e.g. if `range`=(-0.05,  0.05), `n-bins` equidistant bins would be  generated.
          Use to prevent extreme track  values from exploding the bin range and to  ensure
          consistent bins across several runs  of `compute_saddle` command using different  track
          files.
        required: false
        takes_value: true
      - name: --qrange

      description: Minimum mapping quality value (MAPQ)
      required: false
      source: help_parsed
      flag: --min_mapq_val
      takes_value: true
    no_map:
      type: boolean
      description: Avoid storing the --mapout map file
      required: false
      source: help_parsed
      flag: --no_map
      takes_value: false
    tmp_dir:
      type: string
      description: The folder used to store temporary files
      required: false
      source: help_parsed
      flag: --tmp_dir
      takes_value: false
    bt2_ps:
      type: path
      description: Presets options for BowTie2 (applied only when a FASTA file is
        provided)
      required: false
      source: help_parsed
      flag: --bt2_ps
      takes_value: true
    bowtie2_exe:
      type: path
      description: Full path and name of the BowTie2 executable. This option allowsMetaPhlAn
        to reach the executable even when it is not in the system PATH or the system
        PATH is unreachable
      required: false
      source: help_parsed
      flag: --bowtie2_exe
      takes_value: true
    bowtie2_build:
      type: path

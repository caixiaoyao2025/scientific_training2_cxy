      required: false
      source: help_parsed
      flag: --bowtie2_build
      takes_value: true
    tax_lev:
      type: int
      description: CLI flag --tax_lev
      required: false
      source: help_parsed
      flag: --tax_lev
      takes_value: true
    min_alignment_len:
      type: string
      description: The sam records for aligned reads with the longest subalignment  length

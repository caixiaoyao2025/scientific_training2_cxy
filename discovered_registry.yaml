      required: false
      source: help_parsed
      flag: --bowtie2_build
      takes_value: true
    tax_lev:
      type: int
      description: CLI flag --tax_lev
      required: false
      source: help_parsed
      flag: --tax_lev
      takes_value: true
    min_alignment_len:
      type: string
      description: The sam records for aligned reads with the longest subalignment  length
        smaller than this threshold will be discarded.
      required: false
      source: help_parsed
      flag: --min_alignment_len
      takes_value: false
    ignore_eukaryotes:
      type: boolean
      description: Do not profile eukaryotic organisms
      required: false
      source: help_parsed
      flag: --ignore_eukaryotes
      takes_value: false
    ignore_bacteria:
      type: boolean
      description: Do not profile bacterial organisms
      required: false
      source: help_parsed
      flag: --ignore_bacteria
      takes_value: false
    ignore_archaea:
      type: boolean
      description: Do not profile archeal organisms
      required: false
      source: help_parsed
      flag: --ignore_archaea
      takes_value: false
    ignore_ksgbs:
      type: boolean
      description: Do not profile known SGBs (together with --sgb option)
      required: false
      source: help_parsed
      flag: --ignore_ksgbs
      takes_value: false
    ignore_usgbs:
      type: boolean
      description: Do not profile unknown SGBs (together with --sgb option)
      required: false
      source: help_parsed
      flag: --ignore_usgbs
      takes_value: false
    stat_q:
      type: boolean
      description: Quantile value for the robust average
      required: false
      source: help_parsed
      flag: --stat_q
      takes_value: false
    perc_nonzero:
      type: boolean
      description: Percentage of markers with a non zero relative abundance for misidentify

  - info
  - grep
  - sample
  - split
  - pipe
  - revcomp
  - verify
  subcommand_details:
    encode:
      params:
      - name: --format
        type: string
        description: Input file format
        required: true
        takes_value: true
        aliases:
        - -f
      - name: --batch-size
        type: string
        description: Batch size (in records) to use in parallel processing
        required: true
        takes_value: true
        aliases:
        - -b
      - name: --interleaved
        type: boolean
        description: Input is paired-interleaved
        required: false
        takes_value: false
        aliases:
        - -I
      - name: --recursive
        type: boolean
        description: Apply encoding to all fasta/fastq files in the provided directory
          input.
        required: false
        takes_value: false
        aliases:
        - -r
      - name: --manifest
        type: string
        description: Path to a text file containing a list of input files to process.
        required: true
        takes_value: true
        aliases:
        - -M
      - name: --depth
        type: string
        description: Maximum depth in the directory tree to process. Leaving this
          option empty will set no limit
        required: true
        takes_value: true
      - name: --paired
        type: boolean
        description: Encode *{_R1,_R2}* record pairs. Ignored unless `--manifest`
          or `--recursive` is specified
        required: false
        takes_value: false
        aliases:
        - -P
      - name: --collate
        type: boolean
        description: Collate all input files into a single output file. Will respect
          paired records if `--paired` is specified
        required: false
        takes_value: false
        aliases:
        - -C
      - name: --output
        type: string
        description: Output binseq file
        required: true
        takes_value: true
        aliases:
        - -o
      - name: --mode
        type: string
        description: Defines the BINSEQ mode to use
        required: true
        takes_value: true
        aliases:
        - -m
      - name: --policy
        type: string
        description: Policy for handling Ns in sequences
        required: true
        takes_value: true
        aliases:
        - -p
      - name: --bitsize
        type: string
        description: Encoding bitsize (2 or 4 bits per nucleotide)
        required: true
        takes_value: true
        aliases:
        - -S
      - name: --skip-headers
        type: boolean
        description: Exclude sequence names (headers) in the binseq file
        required: false
        takes_value: false
        aliases:
        - -H
      - name: --uncompressed
        type: boolean
        description: 'Skip ZSTD compression of VBQ blocks (default: compressed)'
        required: false
        takes_value: false
        aliases:
        - -u
      - name: --skip-quality
        type: boolean
        description: 'Skip inclusion of quality scores (default: included)'
        required: false
        takes_value: false
        aliases:
        - -Q
      - name: --block-size
        type: string
        description: Virtual block size (in bytes)
        required: true
        takes_value: true
        aliases:
        - -B
      - name: --threads
        type: string
        description: Number of threads to use for parallel reading and writing.
        required: true
        takes_value: true
        aliases:
        - -T
      - name: --level
        type: string
        description: Zstd compression level The compression level is between 1 and
          22, with 3 being the default. Higher levels provide better compression at
          the cost of speed. Level 0 disables compression.
        required: true
        takes_value: true
        aliases:
        - -l
      - name: --archive
        type: boolean
        description: Archive mode
        required: false
        takes_value: false
        aliases:
        - -A
      - name: --pipe
        type: boolean
        description: Pipe the output to stdout
        required: false
        takes_value: false
      - name: input
        type: path
        description: Positional argument INPUT
        positional: true
        position: 0
        required: true
      usage: bqtools encode [OPTIONS] [INPUT]...
    decode:
      params:
      - name: --span
        type: string
        description: Span of records to process. If not specified, all records will
          be processed
        required: true
        takes_value: true
      - name: --output
        type: string
        description: Output file
        required: false
        takes_value: true
        aliases:
        - -o
      - name: --prefix
        type: string
        description: Output file format prefix (required for paired BINSEQ files
        required: true
        takes_value: true
        aliases:
        - -p
      - name: --mate
        type: string
        description: Designate which of the two mates is being processed
        required: true
        takes_value: true
        aliases:
        - -m
      - name: --format
        type: string
        description: Output file format
        required: true
        takes_value: true
        aliases:
        - -f
      - name: --compress
        type: string
        description: Compress output file
        required: true
        takes_value: true
        aliases:

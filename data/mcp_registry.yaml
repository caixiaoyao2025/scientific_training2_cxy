tools:
- name: bioemu
  type: cli
  command: python -m bioemu.sample --filter_samples {filter_samples}
  arg_style: python
  callable_via: python -m bioemu.sample
  readme_examples:
  - python -m bioemu.sample --sequence GYDPETGTWG --num_samples 10 --output_dir ~/test-chignolin
  - python -m bioemu.sample \
  - python -m bioemu.sidechain_relax --pdb-path path/to/topology.pdb --xtc-path path/to/samples.xtc
  readme_usage: python -m bioemu.sample
  description: '[Auto-discovered] Inference code for scalable emulation of protein
    equilibrium ensembles with generative deep learning (⭐866, Python) (license: LICENSE)'
  output_control:
    intercept_large_output: true
    max_preview_lines: 50
  inputs:
    filter_samples:
      type: boolean
      description: 'Type: bool  Default: True  Filter out unphysical samples with
        e.g. long bond distances or steric clashes.'
      required: false
      source: help_parsed
  outputs:
    stdout:
      type: text
      description: Tool result printed to stdout.
      source: inferred
  execution: null
  subcommands: []
  subcommand_details: {}
  subcommand_discovery_complete: false
  install:
    method: pip_pkg
    command: 'pip install bioemu  # source: https://github.com/microsoft/bioemu'
    system_commands: []

tools:
- name: bioemu
  type: cli
  command: bioemu {{input_file}}
  description: '[Auto-discovered] Inference code for scalable emulation of protein
    equilibrium ensembles with generative deep learning (⭐863, Python) (license: LICENSE)'
  output_control:
    intercept_large_output: true
    max_preview_lines: 50
  inputs:
    input_file:
      type: string
      description: Input file path inside /data.
      source: placeholder
  install:
    method: pip_pkg
    command: pip install https://github.com/microsoft/bioemu
    system_commands: []
    python_packages:
    - absl-py==2.5.0
    - aiohappyeyeballs==2.7.1
    - aiohttp==3.14.3
    - aiosignal==1.4.0
    - annotated-doc==0.0.5
    - antlr4-python3-runtime==4.9.3
    - anyio==4.14.2
    - astunparse==1.6.3
    - attrs==26.1.0
    - bio==1.8.3
    - bioemu @ file:///tmp/execute_38nbb4df/bioemu
    - biopython==1.88
    - biothings_client==0.5.1
    - certifi==2026.7.22
    - charset-normalizer==3.4.9

tools:
- name: bioemu
  type: cli
  command: python -m bioemu.sample {sequence} {num_samples} {output_dir} --batch_size_100
    {batch_size_100} --model_name {model_name} --ckpt_path {ckpt_path} --model_config_path
    {model_config_path} --denoiser_type {denoiser_type} --denoiser_config {denoiser_config}
    --cache_embeds_dir {cache_embeds_dir} --cache_so3_dir {cache_so3_dir} --msa_host_url
    {msa_host_url} --filter_samples --base_seed {base_seed}
  arg_style: python
  callable_via: python -m bioemu.sample
  readme_examples:
  - python -m bioemu.sample --sequence GYDPETGTWG --num_samples 10 --output_dir ~/test-chignolin
  - python -m bioemu.sample \
  - python -m bioemu.sidechain_relax --pdb-path path/to/topology.pdb --xtc-path path/to/samples.xtc
  readme_usage: python -m bioemu.sample
  description: '[Auto-discovered] Inference code for scalable emulation of protein
    equilibrium ensembles with generative deep learning (⭐866, Python) (license: LICENSE)'
  output_control:
    intercept_large_output: true
    max_preview_lines: 50
  inputs:
    batch_size_100:
      type: string
      description: Batch size you'd use for a sequence of length 100. The batch size
        will be calculated from this, assuming that the memory requirement to compute
        each sample scales quadratically with the sequence length.
      required: false
      source: help_parsed
    model_name:
      type: string
      description: Name of pretrained model to use. If this is set, you do not need
        to provide `ckpt_path` or `model_config_path`.
      required: false
      source: help_parsed
    ckpt_path:
      type: string
      description: Path to the model checkpoint. If this is set, `model_name` will
        be ignored.
      required: false
      source: help_parsed
    model_config_path:
      type: string
      description: Path to the model config, defining score model architecture and
        the corruption process the model was trained with. Only required if `ckpt_path`
        is set.
      required: false
      source: help_parsed
    denoiser_type:
      type: string
      description: Denoiser to use for sampling, if `denoiser_config` not specified.
        Comes in with default parameter configuration. Must be one of ['dpm', 'heun']
      required: false
      source: help_parsed
    denoiser_config:
      type: string
      description: Path (str or :class:`os.PathLike`) to a denoiser config YAML, or
        a dict. For steered sampling, pass a steering config (e.g., config/steering/physical_steering.yaml)
        which includes the denoiser target, potentials, and steering parameters in
        one file.
      required: false
      source: help_parsed
    cache_embeds_dir:
      type: string
      description: Directory to store MSA embeddings. If not set, this defaults to
        `COLABFOLD_DIR/embeds_cache`.
      required: false
      source: help_parsed
    cache_so3_dir:
      type: string
      description: Directory to store SO3 precomputations. If not set, this defaults
        to `~/sampling_so3_cache`.
      required: false
      source: help_parsed
    msa_host_url:
      type: string
      description: MSA server URL. If not set, this defaults to colabfold's remote
        server. If sequence is an a3m file, this is ignored.
      required: false
      source: help_parsed
    filter_samples:
      type: boolean
      description: Filter out unphysical samples with e.g. long bond distances or
        steric clashes.
      required: false
      source: help_parsed
    base_seed:
      type: string
      description: Base random seed for sampling. If set, each batch's seed will be
        set to base_seed + (num samples already generated).
      required: false
      source: help_parsed
    sequence:
      type: path
      description: Amino acid sequence for which to generate samples, or a path to
        a .fasta file, or a path to an .a3m file with MSAs. If it is not an a3m file,
        then colabfold will be used to generate an MSA and embedding.
      required: true
      source: help_parsed
      positional: true
      position: 0
    num_samples:
      type: path
      description: Number of samples to generate. If `output_dir` already contains
        samples, this function will only generate additional samples necessary to
        reach the specified `num_samples`.
      required: true
      source: help_parsed
      positional: true
      position: 1
    output_dir:
      type: path
      description: Directory to save the samples. Each batch of samples will initially
        be dumped as .npz files. Once all batches are sampled, they will be converted
        to .xtc and .pdb.
      required: true
      source: help_parsed
      positional: true
      position: 2
  outputs:
    output_dir:
      type: file
      description: Directory to save the samples. Each batch of samples will initially
        be dumped as .npz files. Once all batches are sampled, they will be converted
        to .xtc and .pdb.
      source: help_parsed
  execution: null
  subcommands: []
  subcommand_details: {}
  subcommand_discovery_complete: false

tools:
- name: baselines
  type: cli
  command: baselines {{input_file}}
  description: '[Auto-discovered] A comprehensive benchmark on the performances of
    multiple protein backbone generative models. (⭐69, Python)'
  output_control:
    intercept_large_output: true
    max_preview_lines: 50
  inputs:
    input_file:
      type: string
      description: Input file path inside /data.
- name: anarcii
  type: cli
  command: anarcii {{input_file}}

name: Daily Tool Discovery

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 08:00 (北京 16:00)
  workflow_dispatch:       # 手动触发

permissions:
  contents: write          # 允许 commit + push

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet requests beautifulsoup4 pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq git >/dev/null 2>&1 || true

      - name: Run discovery pipeline
        run: python run_pipeline.py "bioinformatics protein engineering tools" 5
        env:
          PYTHONIOENCODING: utf-8
        timeout-minutes: 25

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github_from_html.json tool_library.json tool_library_clean.json discovered_registry.yaml tool_verification.json tool_execution.json excluded_tools.json seen_papers.json data/mcp_registry.yaml || true
          git diff --cached --quiet || git commit -m "auto: daily tool discovery $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "pull/rebase attempt $i failed, retrying..."
            sleep 5
          done
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main

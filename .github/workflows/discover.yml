name: Daily Tool Discovery

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 08:00 (北京 16:00)
  workflow_dispatch:       # 手动触发

permissions:
  contents: write          # 允许 commit + push

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip install --quiet requests beautifulsoup4 pyyaml
          # build toolchain + htslib (samtools/rapidmacs make), libcurl/ssl (pysam),
          # R headers, and common bio deps so C/pysam/R tools can actually build
          sudo apt-get update -qq
          sudo apt-get install -y -qq git build-essential gcc g++ make \
            libhts-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libbz2-dev \
            liblzma-dev r-base >/dev/null 2>&1 || true
          pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null 2>&1 || true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          auto-update-conda: true
          activate-environment: test
          channels: conda-forge,bioconda,defaults

      - name: Configure conda mirror
        run: |
          conda config --add channels conda-forge
          conda config --add channels bioconda
          conda config --set channel_priority strict
          conda config --set show_channel_urls true

      - name: Discover tools (multi-keyword search)
        run: python multi_search.py
        env:
          PYTHONIOENCODING: utf-8
        timeout-minutes: 40

      - name: Convert + clean
        run: |
          python -c "from run_pipeline import step2_convert, step3_clean; step2_convert(); step3_clean()"
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify + execute test (Linux env, real installs)
        run: |
          python -c "from run_pipeline import step3_5_verify, step3_6_execute; step3_5_verify(); step3_6_execute()"
        env:
          PYTHONIOENCODING: utf-8
        timeout-minutes: 90

      - name: Registry + MCP merge
        run: |
          python -c "from run_pipeline import step4_to_registry, step5_register_to_mcp; step4_to_registry(); step5_register_to_mcp()"
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github_from_html.json tool_library.json tool_library_clean.json discovered_registry.yaml tool_verification.json tool_execution.json excluded_tools.json seen_papers.json data/mcp_registry.yaml || true
          git diff --cached --quiet || git commit -m "auto: daily tool discovery $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "pull/rebase attempt $i failed, retrying..."
            sleep 5
          done
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main

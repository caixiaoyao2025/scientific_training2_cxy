name: Deep Tool Discovery (full scan)

on:
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip install --quiet requests beautifulsoup4 pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq git build-essential gcc g++ make \
            libhts-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libbz2-dev \
            liblzma-dev >/dev/null 2>&1 || true
          pip install --quiet playwright openai
          python -m playwright install --with-deps chromium >/dev/null 2>&1 || true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          auto-update-conda: true
          activate-environment: test
          channels: conda-forge,bioconda,defaults

      - name: Configure conda mirror
        run: |
          conda config --add channels conda-forge
          conda config --add channels bioconda
          conda config --set channel_priority strict
          conda config --set show_channel_urls true

      - name: Install R (conda-forge) for R-package tools
        run: |
          conda install -y -c conda-forge r-base >/dev/null 2>&1 || \
            conda install -y r-base >/dev/null 2>&1 || echo "R install skipped/failed"
          which R || echo "R not on PATH"
          R --version 2>/dev/null | head -1 || true

      - name: Discover tools (30 papers per keyword)
        run: python multi_search.py
        env:
          PYTHONIOENCODING: utf-8
          NEW_PER_QUERY: "30"          # collect up to 30 new papers per keyword
          MAX_TOTAL_PER_QUERY: "200"   # scan up to 200 papers per keyword
        timeout-minutes: 120

      - name: Convert + clean
        run: |
          python -c "from run_pipeline import step2_convert, step3_clean; step2_convert(); step3_clean()"
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify + execute test
        run: |
          python -c "from run_pipeline import step3_5_verify, step3_6_execute; step3_5_verify(); step3_6_execute()"
        env:
          PYTHONIOENCODING: utf-8
        timeout-minutes: 90

      - name: Registry + MCP merge
        run: |
          python -c "from run_pipeline import step4_to_registry, step5_register_to_mcp; step4_to_registry(); step5_register_to_mcp()"
        env:
          PYTHONIOENCODING: utf-8

      - name: Test agent can use discovered tools (volcengine LLM)
        if: ${{ secrets.WESTLAKE_API_KEY != '' }}
        run: python tool_agent_test.py
        env:
          PYTHONIOENCODING: utf-8
          WESTLAKE_API_KEY: ${{ secrets.WESTLAKE_API_KEY }}
          WESTLAKE_BASE_URL: ${{ secrets.WESTLAKE_BASE_URL }}
          WESTLAKE_MODEL: ${{ secrets.WESTLAKE_MODEL }}
          REGISTRY: data/mcp_registry.yaml
        timeout-minutes: 20

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github_from_html.json tool_library.json tool_library_clean.json discovered_registry.yaml tool_verification.json tool_execution.json excluded_tools.json seen_papers.json data/mcp_registry.yaml auto_fix_report.json agent_test_report.json || true
          git diff --cached --quiet || git commit -m "auto: deep tool discovery $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "pull/rebase attempt $i failed, retrying..."
            sleep 5
          done
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main

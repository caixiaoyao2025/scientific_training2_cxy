name: Tool Selection Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_tool_selection.py'
      - 'agent_connector/**'
      - 'tool_agent_test.py'
      - 'data/mcp_registry.yaml'

permissions:
  contents: read

jobs:
  selection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml openai graph-tool-call
          python -c "import graph_tool_call; print('graph-tool-call OK')"

      - name: Run retrieval-only test
        env:
          PYTHONIOENCODING: utf-8
        run: python -u test_tool_selection.py --retrieval-only
        timeout-minutes: 5

      - name: Run tool selection test (retrieval + LLM)
        env:
          PYTHONIOENCODING: utf-8
          WESTLAKE_API_KEY: ${{ secrets.WESTLAKE_API_KEY }}
          WESTLAKE_BASE_URL: ${{ secrets.WESTLAKE_BASE_URL }}
          WESTLAKE_MODEL: ${{ secrets.WESTLAKE_MODEL }}
        run: python -u test_tool_selection.py
        timeout-minutes: 15

      - name: Run tool selection test (all_tools)
        env:
          PYTHONIOENCODING: utf-8
          WESTLAKE_API_KEY: ${{ secrets.WESTLAKE_API_KEY }}
          WESTLAKE_BASE_URL: ${{ secrets.WESTLAKE_BASE_URL }}
          WESTLAKE_MODEL: ${{ secrets.WESTLAKE_MODEL }}
        run: python -u test_tool_selection.py --all-tools
        timeout-minutes: 15
